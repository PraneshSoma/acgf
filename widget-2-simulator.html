<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emergent Failure Simulator — ACGF</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #fafaf8;
    --bg2: #f1efe8;
    --border: rgba(0,0,0,0.1);
    --text: #1a1a18;
    --text2: #5f5e5a;
    --text3: #9c9a92;
    --teal: #1D9E75;
    --amber: #BA7517;
    --red: #E24B4A;
    --teal-bg: #E1F5EE;
    --amber-bg: #FAEEDA;
    --red-bg: #FCEBEB;
    --grid: rgba(0,0,0,0.05);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18;
      --bg2: #242422;
      --border: rgba(255,255,255,0.1);
      --text: #e8e6de;
      --text2: #9c9a92;
      --text3: #5f5e5a;
      --teal: #5DCAA5;
      --amber: #EF9F27;
      --red: #F09595;
      --teal-bg: #04342C;
      --amber-bg: #412402;
      --red-bg: #501313;
      --grid: rgba(255,255,255,0.05);
    }
  }

  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    width: 100%;
    max-width: 680px;
  }

  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--red);
    background: var(--red-bg);
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 1rem;
  }

  h2 { font-size: 20px; font-weight: 500; margin-bottom: 0.4rem; line-height: 1.3; }
  .subtitle { font-size: 14px; color: var(--text2); margin-bottom: 1.75rem; }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-bottom: 1.25rem;
  }

  .ctrl {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text2);
    flex: 1;
    min-width: 160px;
  }

  .ctrl label { white-space: nowrap; }

  input[type=range] {
    flex: 1;
    accent-color: var(--teal);
    height: 4px;
    cursor: pointer;
  }

  .val {
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    font-weight: 400;
    color: var(--text);
    min-width: 32px;
    text-align: right;
  }

  .status-track {
    height: 5px;
    background: var(--bg2);
    border-radius: 3px;
    margin-bottom: 1.25rem;
    overflow: hidden;
  }

  .status-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.3s ease, background 0.3s ease;
    width: 5%;
    background: var(--teal);
  }

  .metrics {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 1.25rem;
  }

  .metric {
    background: var(--bg2);
    border-radius: 10px;
    padding: 12px 14px;
  }

  .metric-label { font-size: 11px; color: var(--text3); margin-bottom: 5px; letter-spacing: 0.02em; }
  .metric-val { font-size: 20px; font-weight: 500; }
  .ok { color: var(--teal); }
  .warn { color: var(--amber); }
  .crit { color: var(--red); }

  .canvas-wrap {
    border: 0.5px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    background: var(--bg2);
    margin-bottom: 10px;
  }

  canvas { display: block; width: 100% !important; }

  .legend {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--text3);
    margin-top: 8px;
  }

  .leg-item { display: flex; align-items: center; gap: 5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
</style>
</head>
<body>
<div class="card">
  <span class="tag">ACGF — Simulator</span>
  <h2>The emergent failure problem</h2>
  <p class="subtitle">No individual agent is doing anything wrong. Drag the sliders and watch ten thousand rational decisions produce one irrational outcome.</p>

  <div class="controls">
    <div class="ctrl">
      <label>Agents</label>
      <input type="range" min="1" max="200" value="10" step="1" id="agents" oninput="update()">
      <span class="val" id="agents-val">10</span>
    </div>
    <div class="ctrl">
      <label>Retry aggression</label>
      <input type="range" min="1" max="10" value="3" step="1" id="retry" oninput="update()">
      <span class="val" id="retry-val">3×</span>
    </div>
    <div class="ctrl">
      <label>Peak multiplier</label>
      <input type="range" min="1" max="5" value="1" step="1" id="peak" oninput="update()">
      <span class="val" id="peak-val">1×</span>
    </div>
  </div>

  <div class="status-track"><div class="status-fill" id="sfill"></div></div>

  <div class="metrics">
    <div class="metric"><div class="metric-label">Requests / sec</div><div class="metric-val" id="rps">120</div></div>
    <div class="metric"><div class="metric-label">Infrastructure load</div><div class="metric-val" id="load">12%</div></div>
    <div class="metric"><div class="metric-label">System status</div><div class="metric-val ok" id="status">Healthy</div></div>
  </div>

  <div class="canvas-wrap"><canvas id="sim" height="180"></canvas></div>

  <div class="legend">
    <div class="leg-item"><div class="dot" style="background:#1D9E75"></div> Normal</div>
    <div class="leg-item"><div class="dot" style="background:#BA7517"></div> Retrying</div>
    <div class="leg-item"><div class="dot" style="background:#E24B4A"></div> Storm loop</div>
  </div>
</div>

<script>
const canvas = document.getElementById('sim');
const ctx = canvas.getContext('2d');
const dark = matchMedia('(prefers-color-scheme: dark)').matches;

let agentList = [];
let history = Array(80).fill(0);
let frame = 0;
let currentLoad = 0;

function initAgents(n) {
  const W = canvas.offsetWidth || 640;
  agentList = Array.from({length: n}, () => ({
    x: Math.random() * W,
    y: Math.random() * 180,
    vx: (Math.random() - 0.5) * 1.2,
    vy: (Math.random() - 0.5) * 1.2,
    state: 'normal',
    timer: Math.random() * 60
  }));
}

function update() {
  const n = parseInt(document.getElementById('agents').value);
  const r = parseInt(document.getElementById('retry').value);
  const p = parseInt(document.getElementById('peak').value);

  document.getElementById('agents-val').textContent = n;
  document.getElementById('retry-val').textContent = r + '×';
  document.getElementById('peak-val').textContent = p + '×';

  if (agentList.length !== n) initAgents(n);

  const rps = Math.round(n * 12 * r * p);
  currentLoad = Math.min(Math.round(rps / 10), 100);

  document.getElementById('rps').textContent = rps.toLocaleString();
  document.getElementById('load').textContent = currentLoad + '%';

  const sv = document.getElementById('status');
  const sf = document.getElementById('sfill');
  sf.style.width = currentLoad + '%';

  if (currentLoad < 40) {
    sv.textContent = 'Healthy'; sv.className = 'metric-val ok';
    sf.style.background = dark ? '#5DCAA5' : '#1D9E75';
  } else if (currentLoad < 75) {
    sv.textContent = 'Degraded'; sv.className = 'metric-val warn';
    sf.style.background = dark ? '#EF9F27' : '#BA7517';
  } else {
    sv.textContent = 'Cascade failure'; sv.className = 'metric-val crit';
    sf.style.background = dark ? '#F09595' : '#E24B4A';
  }
}

function draw() {
  const W = canvas.offsetWidth || 640;
  const H = 180;
  canvas.width = W;
  canvas.height = H;
  ctx.clearRect(0, 0, W, H);
  frame++;

  history.push(currentLoad);
  history = history.slice(-80);

  const gridCol = dark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.04)';
  ctx.strokeStyle = gridCol; ctx.lineWidth = 0.5;
  for (let g = 0; g <= 100; g += 25) {
    const y = H - (g * (H - 24) / 100) - 12;
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  ctx.beginPath();
  history.forEach((v, i) => {
    const x = i * (W / 80);
    const y = H - (v * (H - 24) / 100) - 12;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.strokeStyle = currentLoad < 40
    ? (dark ? '#5DCAA5' : '#1D9E75')
    : currentLoad < 75
    ? (dark ? '#EF9F27' : '#BA7517')
    : (dark ? '#F09595' : '#E24B4A');
  ctx.lineWidth = 2;
  ctx.stroke();

  agentList.forEach(a => {
    a.x += a.vx; a.y += a.vy;
    if (a.x < 0 || a.x > W) a.vx *= -1;
    if (a.y < 0 || a.y > H) a.vy *= -1;
    a.timer--;
    if (a.timer <= 0) {
      a.timer = 15 + Math.random() * 35;
      if (currentLoad < 40) a.state = 'normal';
      else if (currentLoad < 75) a.state = Math.random() > 0.4 ? 'retry' : 'normal';
      else a.state = Math.random() > 0.25 ? 'storm' : 'retry';
    }
    const col = a.state === 'normal'
      ? (dark ? '#5DCAA5' : '#1D9E75')
      : a.state === 'retry'
      ? (dark ? '#EF9F27' : '#BA7517')
      : (dark ? '#F09595' : '#E24B4A');

    ctx.beginPath();
    ctx.arc(a.x, a.y, 3.5, 0, Math.PI * 2);
    ctx.fillStyle = col;
    ctx.fill();
  });

  requestAnimationFrame(draw);
}

initAgents(10);
update();
draw();
</script>
</body>
</html>
